name: Restore screenshot design

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-screenshot-design.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact screenshot-era files
        shell: bash
        run: |
          set -euo pipefail

          git checkout 396b09a6e4ca1614da3b70d09400e63564fc6241 --             src/pages/index.astro             src/styles/global.css             src/data/catalog.json             src/data/event_types.json             public/katalog.pdf

          rm -rf public/images/products
          git checkout 396b09a6e4ca1614da3b70d09400e63564fc6241 -- public/images/products

          rm -f .github/workflows/restore-screenshot-design.yml

      - name: Commit exact restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore(ui): exact screenshot-era design"
          git push origin HEAD:main
