name: Restore legacy marketing catalog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-legacy-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-RR catalog assets
        shell: bash
        run: |
          set -euo pipefail
          git checkout f9664d04d93a1143758628031b1d3c000c8a63ed -- src/data/catalog.json public/images/products public/katalog.pdf
          rm -f scripts/sync-rr-catalog.py
          rm -f .github/workflows/sync-rr-catalog.yml
          rm -f docs/rr-sync-report.txt
          rm -f docs/data-sources.md
          rm -f .github/workflows/restore-legacy-catalog.yml

      - name: Commit restored catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore(catalog): use original marketing PDF product set"
          git push origin HEAD:main
