name: Sync RR catalog

on:
  push:
    branches: [sync/rr-catalog-live]
    paths:
      - scripts/sync-rr-catalog.py
      - .github/workflows/sync-rr-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Rebuild catalog from RR Production
        id: sync
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=1
          for attempt in 1 2 3 4 5; do
            echo "RR catalog sync attempt $attempt/5"
            python scripts/sync-rr-catalog.py
            status=$?
            if [ $status -eq 0 ]; then
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit $status
      - name: Commit diagnostic or synced catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rr-sync-report.txt
          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            git add src/data/catalog.json public/images/products
          fi
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore(catalog): record RR Production catalog sync"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Fail when sync failed
        if: steps.sync.outcome != 'success'
        run: exit 1
