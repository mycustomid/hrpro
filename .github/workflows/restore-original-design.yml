name: Restore original design

on:
  push:
    branches: [restore/original-design-catalog-only]
    paths:
      - .github/workflows/restore-original-design.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore original presentation layer
        shell: bash
        run: |
          set -euo pipefail

          git show 80e8e1f70201532038297dab7f85fa42ed165af8:src/pages/index.astro > /tmp/original-index.astro
          git show 80e8e1f70201532038297dab7f85fa42ed165af8:src/styles/global.css > src/styles/global.css
          cp /tmp/original-index.astro src/pages/index.astro

          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/index.astro")
          text = path.read_text(encoding="utf-8-sig")

          text = text.replace('const waNumber = "628131178127";', 'const waNumber = "6281387927481";')
          text = text.replace('const phonePrimary = "+62 813-8117-8127";', 'const phonePrimary = "+62 813-8792-7481";')
          text = text.replace(
              '<span class="price">{item.price}</span>',
              '<span class="price">{item.price ? item.price : "Hubungi untuk harga"}</span>'
          )
          text = text.replace(
              'content="HRproduction - katalog rental sofa dan perlengkapan event. Lengkap, bersih, dan siap acara."',
              'content="HR Production - katalog rental sofa, meja, kursi, dan perlengkapan event. Pilih produk lalu hubungi marketing melalui WhatsApp."'
          )
          text = text.replace(
              '<title>HRproduction | Katalog Rental Event</title>',
              '<title>HR Production | Katalog Rental Event</title>'
          )
          path.write_text(text, encoding="utf-8")
          PY

          rm -f src/pages/404.astro
          rm -f src/pages/event-corporate-pemerintah.astro
          rm -f src/pages/exhibition-conference.astro
          rm -f src/pages/wedding-gala.astro
          rm -f src/pages/katalog.astro
          rm -rf src/pages/artikel

          cat > tests/build-contract.test.mjs <<'TEST'
          import assert from "node:assert/strict";
          import { existsSync } from "node:fs";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const dist = new URL("../dist/", import.meta.url);
          const catalog = JSON.parse(await readFile(new URL("../src/data/catalog.json", import.meta.url), "utf8"));

          test("build returns to the original single-page site", () => {
            assert.equal(existsSync(new URL("index.html", dist)), true);
            assert.equal(existsSync(new URL("katalog/index.html", dist)), false);
            assert.equal(existsSync(new URL("artikel/index.html", dist)), false);
            assert.equal(existsSync(new URL("event-corporate-pemerintah/index.html", dist)), false);
          });

          test("original homepage renders the current RR catalog", async () => {
            const source = await readFile(new URL("index.html", dist), "utf8");
            const cards = source.match(/class="product-card"/g) || [];
            assert.equal(cards.length, catalog.length);
            assert.equal(catalog.length, 93);
            assert.match(source, /Daftar Produk/);
            assert.match(source, /Hubungi untuk harga/);
            assert.match(source, /6281387927481/);
            assert.match(source, /class="float-wa"/);
          });

          test("all catalog images are local WebP assets", () => {
            assert.equal(catalog.every((item) => item.image.startsWith("/images/products/")), true);
            assert.equal(catalog.every((item) => item.image.endsWith(".webp")), true);
            for (const item of catalog) {
              assert.equal(existsSync(new URL(item.image.replace(/^\//, ""), dist)), true, item.image);
            }
          });
          TEST

          cat > scripts/audit-build.mjs <<'AUDIT'
          import assert from "node:assert/strict";
          import { existsSync } from "node:fs";
          import { readFile } from "node:fs/promises";
          import { join, resolve } from "node:path";

          const root = resolve(import.meta.dirname, "..");
          const dist = join(root, "dist");
          const source = await readFile(join(dist, "index.html"), "utf8");
          const catalog = JSON.parse(await readFile(join(root, "src", "data", "catalog.json"), "utf8"));

          assert.equal((source.match(/<h1(?:\s|>)/g) || []).length, 1, "homepage needs one H1");
          assert.equal((source.match(/class="product-card"/g) || []).length, catalog.length, "all RR products must render");
          assert.equal(catalog.length, 93, "expected 93 RR products");
          assert.match(source, /6281387927481/, "marketing WhatsApp missing");
          assert.match(source, /class="float-wa"/, "original floating WhatsApp missing");
          assert.doesNotMatch(source, /Event infrastructure partner|Knowledge base|Operational brief/i, "redesign copy leaked into original site");

          for (const item of catalog) {
            const image = join(dist, item.image.replace(/^\//, ""));
            assert.equal(existsSync(image), true, `missing ${item.image}`);
          }

          console.log(`Original-design audit passed: ${catalog.length} RR products rendered.`);
          AUDIT

          cat > public/sitemap.xml <<'SITEMAP'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://www.hrproduction.id/</loc>
            </url>
          </urlset>
          SITEMAP

          rm -f .github/workflows/restore-original-design.yml

      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore: original single-page design with RR catalog"
          git push origin HEAD:${{ github.ref_name }}
